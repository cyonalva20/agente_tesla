<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Tesla - Sistema Inteligente de Matrículas</title>
    <meta name="description" content="Sistema multiagente de matrículas automatizadas para Academia Tesla">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #161628;
            --bg-card: #1e1e3a;
            --bg-input: #252545;
            --blue: #4f8ef7;
            --blue-glow: rgba(79, 142, 247, 0.3);
            --gold: #f5c842;
            --gold-dim: rgba(245, 200, 66, 0.15);
            --green: #34d399;
            --orange: #fb923c;
            --red: #f87171;
            --text-primary: #e8e8f0;
            --text-secondary: #9999b3;
            --text-muted: #666680;
            --border: rgba(255,255,255,0.06);
            --radius: 12px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* === HEADER === */
        header {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, #1a1a35 100%);
            border-bottom: 1px solid var(--border);
            padding: 14px 28px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }
        .logo {
            font-size: 28px;
            line-height: 1;
        }
        .header-text h1 {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--blue), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-text p {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 400;
            margin-top: 2px;
        }
        .header-badge {
            margin-left: auto;
            font-size: 10px;
            color: var(--green);
            background: rgba(52,211,153,0.1);
            border: 1px solid rgba(52,211,153,0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 500;
        }

        /* === MAIN LAYOUT === */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* === SIDEBAR === */
        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
            flex-shrink: 0;
            overflow-y: auto;
        }
        .sidebar-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Phase Indicator */
        .phase-indicator {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 16px;
            border: 1px solid var(--border);
        }
        .phase-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .phase-value {
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .phase-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            animation: pulse-dot 2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .phase-CAPTACION .phase-dot { background: var(--blue); box-shadow: 0 0 8px var(--blue-glow); }
        .phase-CAPTACION .phase-value { color: var(--blue); }
        .phase-REGISTRO .phase-dot { background: var(--orange); box-shadow: 0 0 8px rgba(251,146,60,0.3); }
        .phase-REGISTRO .phase-value { color: var(--orange); }
        .phase-CIERRE .phase-dot { background: var(--green); box-shadow: 0 0 8px rgba(52,211,153,0.3); }
        .phase-CIERRE .phase-value { color: var(--green); }
        .phase-ESCALAR .phase-dot { background: var(--red); box-shadow: 0 0 8px rgba(248,113,113,0.3); }
        .phase-ESCALAR .phase-value { color: var(--red); }
        .phase-COMPLETADO .phase-dot { background: var(--gold); box-shadow: 0 0 8px var(--gold-dim); }
        .phase-COMPLETADO .phase-value { color: var(--gold); }

        /* Pipeline */
        .pipeline {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .pipeline-step {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            color: var(--text-muted);
            transition: all 0.3s ease;
        }
        .pipeline-step.active {
            background: rgba(79,142,247,0.08);
            color: var(--text-primary);
        }
        .pipeline-step.done {
            color: var(--green);
        }
        .pipeline-icon {
            font-size: 14px;
            width: 20px;
            text-align: center;
        }

        /* Session Data */
        .session-data {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 16px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }
        .data-label {
            color: var(--text-muted);
        }
        .data-value {
            color: var(--text-primary);
            font-weight: 500;
            font-family: 'Inter', monospace;
            font-size: 11px;
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: right;
        }
        .data-value.empty {
            color: var(--text-muted);
            font-style: italic;
        }

        /* New Session Button */
        .btn-new-session {
            margin-top: auto;
            background: transparent;
            border: 1px solid rgba(248,113,113,0.3);
            color: var(--red);
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }
        .btn-new-session:hover {
            background: rgba(248,113,113,0.1);
            border-color: var(--red);
        }

        /* === CHAT PANEL === */
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--text-muted);
            border-radius: 3px;
        }

        /* Message Bubbles */
        .message {
            display: flex;
            gap: 12px;
            max-width: 75%;
            animation: msg-in 0.3s ease-out;
        }
        @keyframes msg-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.bot { align-self: flex-start; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .message.bot .avatar {
            background: linear-gradient(135deg, #2a2a5a, #1e1e3a);
            border: 1px solid var(--border);
        }
        .message.user .avatar {
            background: linear-gradient(135deg, var(--blue), #3a6fd8);
        }

        .bubble {
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
        }
        .message.bot .bubble {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
            color: var(--text-primary);
        }
        .message.user .bubble {
            background: linear-gradient(135deg, var(--blue), #3a6fd8);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: none;
            align-self: flex-start;
            gap: 12px;
            max-width: 75%;
        }
        .typing-indicator.visible { display: flex; }
        .typing-dots {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            padding: 14px 22px;
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .typing-dots span {
            width: 7px;
            height: 7px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* === INPUT BAR === */
        .input-bar {
            padding: 16px 32px 24px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }
        .input-wrapper {
            display: flex;
            align-items: center;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 4px;
            transition: border-color 0.2s;
        }
        .input-wrapper:focus-within {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px var(--blue-glow);
        }
        #msg-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            padding: 12px 16px;
        }
        #msg-input::placeholder {
            color: var(--text-muted);
        }
        .btn-send {
            background: linear-gradient(135deg, var(--blue), #3a6fd8);
            border: none;
            color: #fff;
            width: 42px;
            height: 42px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s, opacity 0.2s;
            flex-shrink: 0;
        }
        .btn-send:hover { transform: scale(1.05); }
        .btn-send:active { transform: scale(0.95); }
        .btn-send:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .chat-messages { padding: 16px; }
            .input-bar { padding: 12px 16px 16px; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">🎓</div>
    <div class="header-text">
        <h1>Academia Tesla</h1>
        <p>Sistema Inteligente de Matrículas</p>
    </div>
    <div class="header-badge">● En línea</div>
</header>

<div class="main-container">
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-title">Estado de Sesión</div>

        <div class="phase-indicator phase-CAPTACION" id="phase-box">
            <div class="phase-label">Fase Actual</div>
            <div class="phase-value">
                <span class="phase-dot"></span>
                <span id="phase-text">CAPTACIÓN</span>
            </div>
        </div>

        <div class="sidebar-title">Pipeline</div>
        <div class="pipeline">
            <div class="pipeline-step active" id="pip-captacion">
                <span class="pipeline-icon">📚</span> Captación
            </div>
            <div class="pipeline-step" id="pip-registro">
                <span class="pipeline-icon">📝</span> Registro
            </div>
            <div class="pipeline-step" id="pip-cierre">
                <span class="pipeline-icon">💳</span> Cierre
            </div>
            <div class="pipeline-step" id="pip-completado">
                <span class="pipeline-icon">✅</span> Completado
            </div>
        </div>

        <div class="sidebar-title">Datos Acumulados</div>
        <div class="session-data">
            <div class="data-row">
                <span class="data-label">DNI Alumno</span>
                <span class="data-value empty" id="sd-dni">—</span>
            </div>
            <div class="data-row">
                <span class="data-label">Ciclo</span>
                <span class="data-value empty" id="sd-ciclo">—</span>
            </div>
            <div class="data-row">
                <span class="data-label">Alumno ID</span>
                <span class="data-value empty" id="sd-alumno">—</span>
            </div>
            <div class="data-row">
                <span class="data-label">Charge ID</span>
                <span class="data-value empty" id="sd-charge">—</span>
            </div>
            <div class="data-row">
                <span class="data-label">Fallos</span>
                <span class="data-value" id="sd-fallos">0</span>
            </div>
        </div>

        <button class="btn-new-session" onclick="nuevaSesion()">🔄 Nueva Sesión</button>
    </aside>

    <!-- CHAT -->
    <main class="chat-panel">
        <div class="chat-messages" id="chat-messages">
            <!-- messages rendered here -->
        </div>
        <div class="typing-indicator" id="typing">
            <div class="avatar" style="background:linear-gradient(135deg,#2a2a5a,#1e1e3a);border:1px solid rgba(255,255,255,0.06)">🤖</div>
            <div class="typing-dots"><span></span><span></span><span></span></div>
        </div>
        <div class="input-bar">
            <div class="input-wrapper">
                <input type="text" id="msg-input" placeholder="Escribe tu mensaje..." autocomplete="off">
                <button class="btn-send" id="btn-send" onclick="enviarMensaje()">➤</button>
            </div>
        </div>
    </main>
</div>

<script>
let sessionId = null;
let sending = false;

const chatBox = document.getElementById('chat-messages');
const input = document.getElementById('msg-input');
const btnSend = document.getElementById('btn-send');
const typing = document.getElementById('typing');

// -- Render messages --
function addMessage(text, role) {
    const div = document.createElement('div');
    div.className = 'message ' + role;
    const avatar = role === 'bot' ? '🤖' : '👤';
    // Convert markdown bold, line breaks
    let html = text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
    div.innerHTML = `
        <div class="avatar">${avatar}</div>
        <div class="bubble">${html}</div>
    `;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}

// -- Update sidebar --
function updateSidebar(data) {
    if (!data) return;
    const fase = data.fase || 'CAPTACION';

    // Phase box
    const box = document.getElementById('phase-box');
    box.className = 'phase-indicator phase-' + fase;
    document.getElementById('phase-text').textContent = fase;

    // Pipeline steps
    const order = ['CAPTACION','REGISTRO','CIERRE','COMPLETADO'];
    const idx = order.indexOf(fase);
    const pips = ['pip-captacion','pip-registro','pip-cierre','pip-completado'];
    pips.forEach((id, i) => {
        const el = document.getElementById(id);
        el.className = 'pipeline-step';
        if (i < idx) el.classList.add('done');
        if (i === idx || (fase === 'ESCALAR')) el.classList.add('active');
    });

    // Session data
    const sd = data.session_data || data;
    setDataValue('sd-dni', sd.dni_alumno);
    setDataValue('sd-ciclo', sd.ciclo_codigo);
    setDataValue('sd-alumno', sd.alumno_id);
    setDataValue('sd-charge', sd.charge_id);
    document.getElementById('sd-fallos').textContent = sd.intentos_fallidos || 0;
}

function setDataValue(id, val) {
    const el = document.getElementById(id);
    if (val) {
        el.textContent = val;
        el.classList.remove('empty');
    } else {
        el.textContent = '—';
        el.classList.add('empty');
    }
}

// -- Send message --
async function enviarMensaje() {
    const msg = input.value.trim();
    if (!msg || sending) return;

    sending = true;
    btnSend.disabled = true;
    input.value = '';
    addMessage(msg, 'user');
    typing.classList.add('visible');

    try {
        const res = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: sessionId, mensaje: msg })
        });
        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.detail || 'Error del servidor');
        }
        const data = await res.json();
        sessionId = data.session_id;
        addMessage(data.respuesta, 'bot');
        updateSidebar(data);
    } catch (e) {
        addMessage('⚠️ Error de conexión: ' + e.message, 'bot');
    } finally {
        typing.classList.remove('visible');
        sending = false;
        btnSend.disabled = false;
        input.focus();
    }
}

// -- New session --
async function nuevaSesion() {
    if (sessionId) {
        try { await fetch('/sesion/' + sessionId, { method: 'DELETE' }); } catch(e) {}
    }
    sessionId = null;
    chatBox.innerHTML = '';
    updateSidebar({ fase:'CAPTACION', session_data:{ dni_alumno:null, ciclo_codigo:null, alumno_id:null, charge_id:null, intentos_fallidos:0 }});
    iniciar();
}

// -- Enter key --
input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviarMensaje(); }
});

// -- Auto-start --
async function iniciar() {
    typing.classList.add('visible');
    try {
        const res = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: null, mensaje: 'Hola' })
        });
        const data = await res.json();
        sessionId = data.session_id;
        addMessage(data.respuesta, 'bot');
        updateSidebar(data);
    } catch (e) {
        addMessage('⚠️ No se pudo conectar con el servidor.', 'bot');
    } finally {
        typing.classList.remove('visible');
        input.focus();
    }
}

iniciar();
</script>
</body>
</html>
